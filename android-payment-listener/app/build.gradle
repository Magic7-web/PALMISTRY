plugins {
    id 'com.android.application'
}

android {
    namespace 'com.palmistry.paymentdiagnostic'
    compileSdk 34

    defaultConfig {
        applicationId 'com.palmistry.paymentdiagnostic'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
